# Backup only: optional manual poll. Primary path is Cloudflare Telegram webhook (instant).
# Disabled schedule to save Actions minutes once webhook is live.

name: TG Commands (backup)

on:
  workflow_dispatch:

concurrency:
  group: tg-commands
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Write .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p reports
          {
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID"
          } > .env

      - name: Poll Telegram once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_DIR: reports
        run: |
          if [ -f data/last_fs_digest.json ]; then
            cp data/last_fs_digest.json reports/last_fs_digest.json
          fi
          python scripts/tg_gha_poll.py
