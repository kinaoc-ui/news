# Scheduled First Screen digest → Telegram (GitHub-hosted)
# Times: 08:30 / 13:00 / 18:00 Hong Kong = 00:30 / 05:00 / 10:00 UTC
#
# Prerequisites:
# 1. Push this news project to a GitHub repo
# 2. Repo Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# 3. Keep a First Screen list at data/first_screen/latest_comma.txt (commit after daily FS)
# 4. Optional Secret: X_BEARER_TOKEN (browser X will NOT work on Actions)

name: FS Digest

on:
  schedule:
    - cron: "30 0 * * *"   # 08:30 HKT
    - cron: "0 5 * * *"    # 13:00 HKT
    - cron: "0 10 * * *"   # 18:00 HKT
  workflow_dispatch:        # manual "Run workflow" button / TG bridge target

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Prepare config + env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          cp config.example.yaml config.yaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          p = Path("config.yaml")
          raw = yaml.safe_load(p.read_text(encoding="utf-8")) or {}
          raw.setdefault("first_screen", {})
          raw["first_screen"]["reports_dir"] = "data/first_screen"
          raw["first_screen"]["lookback_hours"] = 8
          raw["notify"] = {"channels": ["telegram"]}
          p.write_text(yaml.safe_dump(raw, allow_unicode=True, sort_keys=False), encoding="utf-8")
          PY
          {
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID"
            echo "X_BEARER_TOKEN=$X_BEARER_TOKEN"
          } > .env
          # Prefer committed latest_comma.txt; also accept any FirstScreen_*_comma.txt
          mkdir -p data/first_screen
          if [ -f data/first_screen/latest_comma.txt ]; then
            stamp=$(date -u +%Y-%m-%d_%H%M%S)
            cp data/first_screen/latest_comma.txt "data/first_screen/FirstScreen_${stamp}_comma.txt"
          fi
          ls -la data/first_screen || true

      - name: Run digest (news + optional X API)
        # Use api if X_BEARER_TOKEN set; otherwise news-only
        run: |
          if [ -n "${{ secrets.X_BEARER_TOKEN }}" ]; then
            python scripts/run_fs_digest.py --x-source api --lookback-hours 8
          else
            python scripts/run_fs_digest.py --x-source none --lookback-hours 8
          fi

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-digest
          path: |
            reports/fs_digest_*.md
            reports/last_fs_digest.json
          if-no-files-found: ignore
